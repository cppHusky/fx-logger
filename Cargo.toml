[package]
name = "fx-logger"
version = "1.0.1"
authors = ["cppHusky <cpphusky@outlook.com>"]
edition = "2021"
description = "A PostgreSQL-backed cash rate logger"
repository = "https://github.com/cppHusky/fx-logger"
license-file = "LICENSE"

[dependencies]
clap = { version = "4", features = ["derive"] }
ureq = { version = "2", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dotenvy = "0.15"
toml = "0.8"
anyhow = "1"
postgres = "0.19"
